<!DOCTYPE html><html><head><title>Range Input</title><link rel="stylesheet" href="q14.css"></head><body><label>Quantity <input id="range" type="range" min="1" max="100" value="10" oninput="number.value=this.value; units.textContent=this.value+' units'"></label><input id="number" type="number" value="10" min="1" max="100" oninput="range.value=this.value; units.textContent=this.value+' units'"><span id="units">10 units</span></body></html>
